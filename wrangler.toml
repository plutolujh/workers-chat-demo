name = "edge-chat-demo"
compatibility_date = "2024-01-01"

main = "src/chat.mjs"

# Replace __GIT_COMMIT__ with actual git commit hash at build time
build_command = "sed -i.bak 's/__GIT_COMMIT__/'$(git rev-parse --short HEAD)'/g' src/chat.mjs && rm -f src/chat.mjs.bak"

[durable_objects]
bindings = [
  { name = "rooms", class_name = "ChatRoom" },
  { name = "limiters", class_name = "RateLimiter" },
]

[[rules]]
type = "Data"
globs = ["**/*.html"]
fallthrough = false

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatRoom", "RateLimiter"]

[vars]
SHOTSYNC_URL = "https://shotsync.hao123456.cn"

# Preview environment
[env.preview]
name = "edge-chat-demo-preview"

[env.preview.durable_objects]
bindings = [
  { name = "rooms", class_name = "ChatRoom" },
  { name = "limiters", class_name = "RateLimiter" },
]
