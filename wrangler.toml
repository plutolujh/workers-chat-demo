name = "edge-chat-demo"
compatibility_date = "2024-01-01"

main = "src/chat.mjs"

[durable_objects]
bindings = [
  { name = "rooms", class_name = "ChatRoom" },
  { name = "limiters", class_name = "RateLimiter" },
]

[[rules]]
type = "Data"
globs = ["**/*.html"]
fallthrough = false

# Indicate that you want the ChatRoom and RateLimiter classes to be callable as Durable Objects.
[[migrations]]
tag = "v1"                                       # Should be unique for each entry
new_sqlite_classes = ["ChatRoom", "RateLimiter"]

# Shotsync configuration for image uploads
[vars]
SHOTSYNC_URL = "https://shotsync.hao123456.cn"

# These should be set via: wrangler secret put SHOTSYNC_TOKEN
# SHOTSYNC_TOKEN = ""

# Build script to inject git commit hash as version
[build]
command = "sed -i.bak 's/v:AUTO/v:'\"$(git rev-parse --short HEAD)\"'/g' src/chat.html && rm -f src/chat.html.bak"
